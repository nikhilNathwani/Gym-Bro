name: GymLog
options:
  bundleIdPrefix: com.nikhilnathwani
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.53.0
targets:
  GymLog:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Gym Log
        SupabaseURL: https://$(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilnathwani.gymlog
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "4J8529PB76"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      DevelopmentTeam: "4J8529PB76"
      ProvisioningStyle: Automatic
  GymLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilnathwani.gymlog.uitests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "5BWXZ738L7"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    attributes:
      DevelopmentTeam: "5BWXZ738L7"
      ProvisioningStyle: Automatic
    dependencies:
      - target: GymLog
