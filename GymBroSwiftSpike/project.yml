name: GymBroSwiftSpike
options:
  bundleIdPrefix: com.nikhilnathwani.spike
  deploymentTarget:
    iOS: "17.0"
targets:
  GymBroSwiftSpike:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilnathwani.spike.GymBroSwiftSpike
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
